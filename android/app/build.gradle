apply plugin: 'com.android.application'

android {
    // Android 16 (API 36). Google Play exige API 35+ para seguir distribuyendo
    // apps existentes desde el 31 ago 2026, y API 36 para cualquier
    // actualización enviada a partir de esa fecha. Vamos directos a 36 para no
    // tener que repetir la subida dentro de unas semanas.
    compileSdk 36
    namespace 'es.buscaycurra.app'

    defaultConfig {
        applicationId 'es.buscaycurra.app'
        minSdk 21
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv('KEYSTORE_PATH') ?: '../android.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
            keyAlias      System.getenv('KEY_ALIAS')         ?: 'android'
            keyPassword   System.getenv('KEY_PASSWORD')      ?: 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
