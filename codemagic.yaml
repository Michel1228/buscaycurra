workflows:
  ios-app-store:
    name: BuscayCurra iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: unified-production
          include: true
          source: true
    environment:
      groups:
        - ios-app-store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: es.buscaycurra.app
      vars:
        BUNDLE_ID: es.buscaycurra.app
        APPLE_TEAM_ID: P9L962T32A
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias Node
        script: npm ci
      - name: Crear plataforma iOS
        script: |
          rm -rf ios
          npx cap add ios --packagemanager cocoapods
      - name: Habilitar gesto iOS de volver atras (swipe back)
        script: |
          # Guideline 4 de Apple: activar el gesto de deslizar desde el borde para volver.
          #
          # ⚠️ LECCION (builds 18 y 19 rechazadas por pantalla en blanco): NO crear un
          # MainViewController.swift nuevo + parche del storyboard. El .swift suelto no se
          # registra en project.pbxproj, Xcode no lo compila, el storyboard apunta a una
          # clase inexistente y el arranque queda SIN WebView → pantalla en blanco eterna
          # (cero peticiones al servidor; verificado en los logs de Traefik: el iPad del
          # revisor nunca pidio "/"). La build 17, sin este parche, arrancaba bien.
          #
          # Enfoque seguro: inyectar el gesto en AppDelegate.swift, que YA forma parte del
          # proyecto Xcode. Si la inyeccion rompiera la sintaxis, la build FALLA visible en
          # Codemagic (error de compilacion) en vez de empaquetar una app rota. En runtime
          # es un encadenado opcional: si algo no casa, simplemente no activa el gesto.
          AD="ios/App/App/AppDelegate.swift"
          perl -0pi -e 's/(func application\(_ application: UIApplication, didFinishLaunchingWithOptions[^\{]*\{)/$1\n        DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {\n            (self.window?.rootViewController as? CAPBridgeViewController)?.webView?.allowsBackForwardNavigationGestures = true\n        }/' "$AD"
          echo "— Verificacion de la inyeccion en AppDelegate —"
          grep -n "allowsBackForwardNavigationGestures" "$AD" || { echo "AVISO: no se pudo inyectar el gesto (se continua SIN gesto, la app arranca igual)"; }
          echo "— El storyboard queda de serie (CAPBridgeViewController) —"
          grep -n "CAPBridgeViewController" ios/App/App/Base.lproj/Main.storyboard
      - name: Generar iconos nativos iOS
        script: npx @capacitor/assets generate --ios
      - name: Instalar CocoaPods
        script: cd ios/App && pod install
      - name: Sincronizar Capacitor
        script: npx cap sync ios
      - name: Configurar Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'BuscayCurra necesita acceso a tu galería para añadir una foto a tu CV'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'BuscayCurra necesita acceso a tu galería para añadir una foto a tu CV'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'BuscayCurra necesita acceso a tu cámara para hacer una foto para tu CV'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'BuscayCurra necesita acceso a tu cámara para hacer una foto para tu CV'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'BuscayCurra necesita guardar tu foto de perfil en la galería'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'BuscayCurra necesita guardar tu foto de perfil en la galería'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'BuscayCurra necesita acceso al micrófono para grabar vídeo'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'BuscayCurra necesita acceso al micrófono para grabar vídeo'" "$PLIST"
      - name: Incrementar build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Construir IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
