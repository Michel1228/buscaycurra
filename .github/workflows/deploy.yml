name: Build & Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/michel1228/buscaycurra

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}:latest
            ${{ env.REGISTRY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ojesordjedovnpyxspxi.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_YCsE2bdWgmtR8U9AvmfRCA_n09gvZyN
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_51TL2FqPsw6T9Raor1NRKN1KAsx6nd9ex8bpNfotXsfykewT6BGlwOeoNb3j3wxQ3JzFisSirGzjPcLD4m6BziBhH00NLexB96S
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=BDy57EXay3f97rznP-2QOJOrs2KWYqgWAK-PtQ9oF8W9Yxpu9ri_kqbYKKVgHByP5wOnoEfyTLigsaLRuawblZo

      # La URL del webhook lleva su token: va en los secretos del repositorio,
      # no aqui (el repositorio es publico).
      - name: Deploy to Easypanel via webhook
        run: |
          echo "== Triggering Easypanel deploy webhook =="
          RESP=$(curl -s --connect-timeout 20 --max-time 40 -X POST \
            "${{ secrets.EASYPANEL_DEPLOY_URL }}" \
            || echo "curl_failed")
          echo "Webhook response: $RESP"
          if [ "$RESP" = "curl_failed" ]; then
            echo "Warning: Easypanel webhook not reachable — image is in GHCR, deploy manually if needed"
          else
            echo "Deploy triggered OK"
          fi
