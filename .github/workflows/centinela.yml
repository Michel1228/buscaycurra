name: Centinela — la app dice la verdad

# Ninguno de los fallos que nos han costado usuarios estaba caído. Todos
# devolvían 200 y una pantalla con buena pinta:
#
#   Japón con 19 ofertas .................. la base respondía
#   6 enlaces muertos en la portada ....... devolvía 200
#   Buscador sin url, fecha ni fuente ..... devolvía 200
#   El filtro de salario no filtraba ...... devolvía 200
#   6.820 ofertas gallegas como suecas .... se insertaban sin error
#
# El monitor de salud (api-health-monitor.yml) mira si algo está caído. Este
# mira si algo MIENTE, que es lo que de verdad ha pasado. Cada comprobación
# nace de un fallo real, no de una lista imaginada.
#
# Sale por la mañana, después del barrido de Adzuna, para que juzgue el día ya
# sincronizado y no la foto de la madrugada.

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC — 08:30 en España, tras el barrido de las 5
  workflow_dispatch:

jobs:
  centinela:
    name: Comprobar la salud real
    runs-on: ubuntu-latest
    steps:
      - name: Preguntar al centinela
        run: |
          RESP=$(curl -s -w "\n%{http_code}" \
            "https://buscaycurra.es/api/admin/centinela" \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            --max-time 150)

          CODIGO=$(echo "$RESP" | tail -1)
          CUERPO=$(echo "$RESP" | sed '$d')

          echo "$CUERPO" | python3 -m json.tool 2>/dev/null || echo "$CUERPO"

          # Sin respuesta legible el centinela no ha podido opinar. Eso NO es un
          # aprobado: es no haber mirado, y hay que distinguirlo.
          if [ -z "$CODIGO" ] || ! echo "$CUERPO" | grep -q '"comprobaciones"'; then
            echo "::error::El centinela no respondio (HTTP $CODIGO). No se ha comprobado nada."
            exit 1
          fi

          # Una linea de aviso por cada comprobacion que falla, con el fallo del
          # que nace, para no tener que ir a buscar el contexto.
          echo "$CUERPO" | python3 -c "
import json, sys
d = json.load(sys.stdin)
for c in d['comprobaciones']:
    if not c['bien']:
        print(f\"::error::{c['nombre']} — {c['detalle']}  (nacio de: {c['nacioDe']})\")
print(f\"{d['pasan']} pasan, {d['fallan']} fallan\")
sys.exit(1 if d['fallan'] else 0)
"
