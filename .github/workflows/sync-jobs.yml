name: Sync Job Listings — Adzuna + Careerjet Global

on:
  schedule:
    - cron: '0 */2 * * 1-5'
    - cron: '0 */4 * * 0,6'
  workflow_dispatch:
    inputs:
      country:
        description: 'País Adzuna'
        required: false
      batchSize:
        description: 'Combos por país'
        default: '15'
        required: false

jobs:
  sync-adzuna:
    name: "Adzuna ${{ matrix.country }} × ${{ matrix.batch }} c"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # REPARTO POR MERCADO, NO POR VOLUMEN BRUTO DE LA API.
          #
          # Estaba ordenado por cuántas ofertas tiene cada país en Adzuna, y así
          # Estados Unidos, Australia y Canadá se llevaban más cuota que España.
          # Medido en producción: España tenía 30.058 ofertas activas y Estados
          # Unidos 481.365 — dieciséis veces más en el país que no atendemos.
          #
          # La cuota de Adzuna está al 95 % (2.500 de 2.640), así que aquí no se
          # puede subir el total: esto es un reparto. Lo que se le quita a
          # ultramar se le da a España y a los destinos a los que emigra
          # nuestra gente.
          # España primero: es el mercado de la aplicación
          - { country: es, batch: 25 }
          # Destinos principales de la emigración española
          - { country: de, batch: 20 }
          - { country: fr, batch: 20 }
          - { country: uk, batch: 15 }
          - { country: it, batch: 15 }
          - { country: nl, batch: 15 }
          - { country: ie, batch: 12 }
          - { country: ch, batch: 10 }
          - { country: se, batch: 10 }
          # Ultramar: se mantienen, pero ya no por delante del mercado propio
          - { country: us, batch: 12 }
          - { country: ca, batch: 10 }
          - { country: au, batch: 10 }
    steps:
      - name: Sync Adzuna ${{ matrix.country }}
        run: |
          RESULT=$(curl -s -w "\n%{http_code}" -X POST "https://buscaycurra.es/api/jobs/sync-adzuna-global" \
            -H "x-sync-secret: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"country\":\"${{ matrix.country }}\",\"batchSize\":${{ matrix.batch }}}" \
            --max-time 180)
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -1)
          echo "${{ matrix.country }}: HTTP $HTTP_CODE — $BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || exit 1

  sync-careerjet:
    name: "Careerjet ${{ matrix.country }} × ${{ matrix.batch }} c"
    runs-on: ubuntu-latest
    # `needs` se mantiene SOLO para que Careerjet vaya DESPUÉS de Adzuna y no
    # se solapen dos sincronizaciones sobre un servidor de dos núcleos.
    #
    # El `if: always()` es lo importante: sin él, `needs` significa además
    # "solo si Adzuna terminó BIEN", y como Adzuna vive al 95 % de su cuota
    # diaria (2.500 de 2.640, 11 de sus 12 claves agotadas), basta con que UN
    # país suyo falle para que se salten los 21 países de Careerjet.
    #
    # Eso es justo lo que estaba pasando: Careerjet llevaba 21 peticiones de
    # las 20.000 que tiene al día — el 0,1 % — mientras Adzuna se ahogaba.
    # La API con más margen de todas era la que no se estaba usando.
    needs: sync-adzuna
    if: always()
    strategy:
      fail-fast: false
      # El servidor tiene dos núcleos y un 85 % de CPU robada por el hipervisor.
      # Veinte trabajos en paralelo lo tumban, así que van de cuatro en cuatro:
      # tarda más, pero la web sigue respondiendo mientras tanto.
      max-parallel: 4
      matrix:
        include:
          # AQUÍ SÍ HAY SITIO PARA SUBIR, Y ES DONDE MÁS SE GANA.
          #
          # Careerjet permite 20.000 peticiones al día y estábamos usando el
          # 0,1 %. Cada combinación es una petición, así que estos números,
          # multiplicados por las doce ejecuciones diarias, siguen quedándose
          # muy por debajo del límite. Era la API con más margen de todas y la
          # que menos se usaba.
          # España al tope que admite el endpoint
          - { country: es, batch: 50 }
          # Destinos principales
          - { country: de, batch: 40 }
          - { country: fr, batch: 40 }
          - { country: uk, batch: 30 }
          - { country: it, batch: 30 }
          - { country: nl, batch: 25 }
          - { country: pt, batch: 25 }
          - { country: be, batch: 20 }
          - { country: ch, batch: 20 }
          - { country: ie, batch: 20 }
          - { country: at, batch: 15 }
          - { country: se, batch: 15 }
          - { country: no, batch: 15 }
          - { country: dk, batch: 15 }
          - { country: fi, batch: 15 }
          - { country: pl, batch: 15 }
          # Ultramar
          - { country: us, batch: 15 }
          - { country: ca, batch: 12 }
          - { country: au, batch: 12 }
          - { country: nz, batch: 10 }
    steps:
      - name: Sync Careerjet ${{ matrix.country }}
        run: |
          RESULT=$(curl -s -w "\n%{http_code}" -X POST "https://buscaycurra.es/api/jobs/sync-careerjet-global" \
            -H "x-sync-secret: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"country\":\"${{ matrix.country }}\",\"batchSize\":${{ matrix.batch }}}" \
            --max-time 180)
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -1)
          echo "${{ matrix.country }}: HTTP $HTTP_CODE — $BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1
