name: Barrido diario de Adzuna

# POR QUÉ ESTE Y NO EL DE SIEMPRE
#
# sync-jobs.yml recorre combinaciones de palabra clave por ciudad y de cada una
# pide solo la página 1. Cada pasada vuelve a bajarse esas mismas primeras
# páginas: de las ~104.000 ofertas que trae al día, solo 16.000 son nuevas.
#
# Este pagina el catálogo sin palabras clave. Medido contra producción el 5 de
# septiembre de 2026:
#
#   método            peticiones   ofertas nuevas   por petición
#   ─────────────────────────────────────────────────────────────
#   palabra × ciudad      2.088           16.000           7,7
#   barrido paginado         35            1.366          39,0
#
# Cinco veces más por cada llamada a la API.
#
# Sale una vez al día porque `dias=1` pide lo publicado en las últimas 24 horas:
# lanzarlo más veces solo volvería a bajarse las mismas páginas.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC — 07:00 en España, antes de que entre nadie
  workflow_dispatch:

jobs:
  barrido:
    name: "Barrido ${{ matrix.pais }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Máximo dos a la vez: el VPS tiene 2 núcleos y un 85% de robo de CPU del
      # hipervisor. Más en paralelo y la web se arrastra para quien la esté
      # usando.
      max-parallel: 2
      matrix:
        include:
          # El tope de páginas se ajusta a lo que publica cada país al día. En
          # España son 3.897 ofertas = 78 páginas; se dejan 120 de margen.
          #
          # NO están Brasil, México, India ni Sudáfrica aunque Adzuna los cubra:
          # no son ninguno de los 26 países de la aplicación, así que sus
          # ofertas no las ve nadie. Ya hay 194.192 así en la base de antes.
          - { pais: es, tope: 120 }   # el mercado propio va primero
          - { pais: de, tope: 100 }
          - { pais: fr, tope: 100 }
          - { pais: uk, tope: 100 }
          - { pais: it, tope: 60 }
          - { pais: nl, tope: 60 }
          - { pais: ch, tope: 60 }
          - { pais: be, tope: 60 }
          - { pais: at, tope: 60 }
          - { pais: us, tope: 40 }
          - { pais: ca, tope: 40 }
          - { pais: au, tope: 40 }
          - { pais: nz, tope: 40 }
          - { pais: pl, tope: 40 }
          - { pais: sg, tope: 40 }
    steps:
      - name: Barrer ${{ matrix.pais }}
        run: |
          TOPE=${{ matrix.tope }}
          DESDE=1
          TOTAL_NUEVAS=0
          TOTAL_TRAIDAS=0

          # Se pide de 60 en 60 (el tope por llamada) hasta agotar el catálogo
          # del día o llegar al límite del país. `agotado` viene a true cuando
          # una página vuelve vacía, que es tanto el final como el momento en
          # que la cuota de Adzuna se acaba: en los dos casos toca parar.
          while [ "$DESDE" -le "$TOPE" ]; do
            LOTE=60
            RESTA=$((TOPE - DESDE + 1))
            if [ "$RESTA" -lt "$LOTE" ]; then LOTE=$RESTA; fi

            RESP=$(curl -s -X POST "https://buscaycurra.es/api/jobs/sync-adzuna-barrido" \
              -H "Content-Type: application/json" \
              -H "x-sync-secret: ${{ secrets.ADMIN_SECRET }}" \
              -d "{\"country\":\"${{ matrix.pais }}\",\"paginas\":$LOTE,\"dias\":1,\"desde\":$DESDE}" \
              --max-time 290)

            echo "  desde $DESDE: $RESP"

            NUEVAS=$(echo "$RESP" | grep -o '"insertadas":[0-9]*' | cut -d: -f2)
            TRAIDAS=$(echo "$RESP" | grep -o '"traidas":[0-9]*' | cut -d: -f2)
            AGOTADO=$(echo "$RESP" | grep -o '"agotado":[a-z]*' | cut -d: -f2)

            # Respuesta ilegible (timeout, 502, caída): parar en vez de seguir
            # pidiendo a ciegas.
            if [ -z "$NUEVAS" ]; then
              echo "::warning::${{ matrix.pais }}: respuesta inesperada, se corta el barrido"
              break
            fi

            TOTAL_NUEVAS=$((TOTAL_NUEVAS + NUEVAS))
            TOTAL_TRAIDAS=$((TOTAL_TRAIDAS + TRAIDAS))

            if [ "$AGOTADO" = "true" ]; then break; fi
            DESDE=$((DESDE + LOTE))
            sleep 2
          done

          echo "${{ matrix.pais }}: $TOTAL_NUEVAS nuevas de $TOTAL_TRAIDAS traidas"

          # Cero ofertas nuevas en un país entero no es "un día tranquilo": es
          # que algo dejó de funcionar. La sincronización llevaba 74 días
          # devolviendo cero en una fuente y nadie se enteró porque nada avisaba.
          if [ "$TOTAL_TRAIDAS" -eq 0 ]; then
            echo "::warning::${{ matrix.pais }}: el barrido no trajo NINGUNA oferta. Revisar la cuota de Adzuna o la clave."
          fi
